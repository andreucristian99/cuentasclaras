<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cuentas Claras">
<title>Cuentas Claras</title>
<style>
:root{--bg:#0f1430;--card:#1a2247;--card2:#222b57;--line:#2e3868;--txt:#eef1fb;--mut:#9aa3c7;--or:#ff8a3d;--green:#3ecf8e;--red:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--or)}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 110px}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.top h1{font-size:22px;margin:0}
.top .sub{color:var(--mut);font-size:13px}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--card);display:grid;place-items:center;font-size:18px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,#ff8a3d 0%,#e2632a 100%);color:#fff}
.hero .lbl{font-size:13px;opacity:.9;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.hero .big{font-size:38px;font-weight:800;margin:4px 0 12px;letter-spacing:-.02em}
.hero .row{display:flex;gap:10px}
.hero .mini{flex:1;background:rgba(255,255,255,.18);border-radius:12px;padding:10px}
.hero .mini span{display:block;font-size:12px;opacity:.9}
.hero .mini b{font-size:17px}
.sect{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin:18px 4px 8px;display:flex;justify-content:space-between;align-items:center}
.sect button{color:var(--or);text-transform:none;letter-spacing:0;font-size:14px}
.accs{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.accs::-webkit-scrollbar{display:none}
.acc{min-width:140px;background:var(--card);border-radius:14px;padding:12px}
.acc span{color:var(--mut);font-size:13px;display:block}
.acc b{font-size:18px}
.monthnav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;padding:6px;margin-bottom:12px}
.monthnav button{width:40px;height:36px;border-radius:10px;font-size:18px}
.monthnav button:active{background:var(--card2)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:14px;padding:12px;border-left:4px solid var(--c)}
.stat span{font-size:13px;color:var(--mut);display:block}
.stat b{font-size:18px}
.stat.wide{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--card2);margin-top:10px}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12px;color:var(--mut)}
.legend em{font-style:normal;display:inline-flex;align-items:center;gap:5px}
.legend em::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.list{background:var(--card);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,var(--c) 20%,transparent);flex:none}
.item .mid{flex:1;min-width:0}
.item .mid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mid span{font-size:13px;color:var(--mut)}
.item .amt{font-weight:700;white-space:nowrap}
.pos{color:var(--green)}.neg{color:var(--txt)}
.dayhead{font-size:12px;color:var(--mut);padding:10px 14px 4px;background:var(--card)}
.pill{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:rgba(62,207,142,.15);color:var(--green)}
.pill.go{background:var(--or);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 12px;border-radius:999px;background:var(--card);font-size:14px;white-space:nowrap;border:1px solid transparent}
.chip.on{border-color:var(--c,var(--or));background:color-mix(in srgb,var(--c,var(--or)) 22%,var(--card))}
.empty{color:var(--mut);text-align:center;padding:22px 12px;font-size:14px}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--or);color:#fff;font-weight:700;font-size:16px;text-align:center}
.btn.sec{background:var(--card2);color:var(--txt)}
.btn.danger{background:transparent;color:var(--red);border:1px solid rgba(255,107,107,.4)}
.btn+.btn{margin-top:10px}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(84px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;background:var(--or);color:#fff;font-size:32px;box-shadow:0 8px 24px rgba(255,138,61,.4);z-index:5;line-height:1}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(15,20,48,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav .in{max-width:560px;margin:0 auto;display:flex}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--mut)}
nav button i{font-style:normal;font-size:20px}
nav button.on{color:var(--or)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 14px;font-size:20px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
.amtin{font-size:30px;font-weight:800;text-align:center;padding:14px}
.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.goal{height:12px;background:var(--card2);border-radius:8px;overflow:hidden;margin:10px 0 6px}
.goal i{display:block;height:100%;background:#ffd166;border-radius:8px}
.note{font-size:13px;color:var(--mut);line-height:1.45}
/* lock */
.lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.logo{width:72px;height:72px;border-radius:22px;background:var(--or);display:grid;place-items:center;font-size:36px;margin-bottom:14px}
.lock h1{margin:0 0 4px;font-size:26px}
.lock p{color:var(--mut);margin:0 0 22px}
.profs{width:100%;max-width:320px}
.prof{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;font-weight:600;text-align:left}
.prof .av{width:38px;height:38px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:800;color:var(--or)}
.dots{display:flex;gap:14px;justify-content:center;margin:8px 0 22px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--mut)}
.dots i.f{background:var(--or);border-color:var(--or)}
.dots.err{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center}
.pad button{width:72px;height:72px;border-radius:50%;background:var(--card);font-size:26px;font-weight:600}
.pad button:active{background:var(--card2)}
.curpick{display:flex;flex-direction:column;gap:8px}
.curopt{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.curopt span{font-size:22px}.curopt b{flex:1;font-weight:600}.curopt i{font-style:normal;color:var(--mut);font-weight:700}
.curopt.on{border-color:var(--or);background:color-mix(in srgb,var(--or) 16%,var(--card))}.curopt.on i{color:var(--or)}
.hcur{padding:10px 0;border-top:1px solid rgba(255,255,255,.25)}.hcur.first{border-top:0;padding-top:4px}
.hc-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.hc-top span{font-size:14px;font-weight:600;opacity:.95}.hc-top b{font-size:22px;font-weight:800}.hcur.first .hc-top b{font-size:30px}
.hc-sub{font-size:12px;opacity:.85;margin-top:2px}
.link{color:var(--mut);margin-top:22px;font-size:14px;text-decoration:underline}
</style>
</head>
<body>
<div id="app"></div>
<div class="overlay" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";
/* ---------- config ---------- */
const TYPES={
  ingreso:{label:"Ingreso",plural:"Ingresos",c:"#3ecf8e",e:"💰",sign:1},
  fijo:{label:"Gasto fijo",plural:"Gastos fijos",c:"#6ea8ff",e:"🏠",sign:-1},
  boludo:{label:"Gasto boludo",plural:"Gastos boludos",c:"#ff6b8b",e:"🍔",sign:-1},
  sub:{label:"Suscripción",plural:"Suscripciones",c:"#b48cff",e:"📺",sign:-1},
  ahorro:{label:"A ahorros",plural:"Ahorros",c:"#ffd166",e:"🐷",sign:-1},
  retiro:{label:"Sacado de ahorros",plural:"Sacado de ahorros",c:"#ffd166",e:"↩️",sign:1}
};
const ADD_TYPES=["boludo","fijo","sub","ingreso","ahorro"];

/* ---------- storage (falls back to memory) ---------- */
const mem={};
const store={
  get(k){try{const v=localStorage.getItem(k);return v===null?(k in mem?mem[k]:null):v}catch(e){return k in mem?mem[k]:null}},
  set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}},
  del(k){delete mem[k];try{localStorage.removeItem(k)}catch(e){}}
};
const sess={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad2=n=>String(n).padStart(2,"0");
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())};
const curMonth=()=>todayStr().slice(0,7);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CUR={
  EUR:{loc:"es-ES",sym:"€",name:"Euros",flag:"🇪🇺"},
  USD:{loc:"es-ES",sym:"US$",name:"Dólares (USD)",flag:"🇺🇸"},
  ARS:{loc:"es-AR",sym:"$",name:"Pesos argentinos (ARS)",flag:"🇦🇷"}
};
const NFS={};
function getNF(c){if(!CUR[c])c="EUR";if(!NFS[c]){try{NFS[c]=new Intl.NumberFormat(CUR[c].loc,{style:"currency",currency:c,useGrouping:"always"})}catch(e){NFS[c]={format:n=>n.toFixed(2).replace(".",",")+" "+CUR[c].sym}}}return NFS[c]}
const curCode=()=>(D&&CUR[D.currency])?D.currency:"EUR";
const fmt=(n,c)=>getNF(c||curCode()).format(Math.round((+n||0)*100)/100);
const ph=c=>"0,00 "+CUR[(c&&CUR[c])?c:curCode()].sym;
const parseAmt=s=>{s=String(s||"").trim().replace(/\s|€/g,"");if(s.includes(",")){s=s.replace(/\./g,"").replace(",",".")}else if(/^\d{1,3}(\.\d{3})+$/.test(s)){s=s.replace(/\./g,"")}const n=parseFloat(s);return isFinite(n)?Math.round(n*100)/100:NaN};
const amtStr=n=>(Math.round(n*100)/100).toString().replace(".",",");
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const monthName=m=>{const [y,mo]=m.split("-").map(Number);try{return cap(new Date(y,mo-1,1).toLocaleDateString("es-ES",{month:"long"}))+" "+y}catch(e){return m}};
const shiftMonth=(m,d)=>{let [y,mo]=m.split("-").map(Number);mo+=d;while(mo<1){mo+=12;y--}while(mo>12){mo-=12;y++}return y+"-"+pad2(mo)};
const dayLabel=s=>{if(s===todayStr())return "Hoy";const [y,m,d]=s.split("-").map(Number);try{return cap(new Date(y,m-1,d).toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"short"}))}catch(e){return s}};
const daysInMonth=m=>{const [y,mo]=m.split("-").map(Number);return new Date(y,mo,0).getDate()};

async function hashPin(pin,salt){
  const s=salt+":"+pin;
  try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")}}catch(e){}
  let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return "f"+(h>>>0).toString(16);
}

/* ---------- state ---------- */
let profiles=[];try{profiles=JSON.parse(store.get("cc_profiles")||"[]")}catch(e){profiles=[]}
const saveProfiles=()=>store.set("cc_profiles",JSON.stringify(profiles));
let P=null,D=null;
const S={view:"inicio",month:curMonth(),filter:"todos",lockStep:null,pin:"",pin1:"",newName:"",newCur:"EUR"};
const curPicker=(sel,act)=>`<div class="curpick">${Object.keys(CUR).map(k=>`<button class="curopt ${sel===k?"on":""}" data-act="${act}" data-c="${k}"><span>${CUR[k].flag}</span><b>${CUR[k].name}</b><i>${CUR[k].sym}</i></button>`).join("")}</div>`;

function blank(){return{currency:"EUR",accounts:[],tx:[],recurring:[],savingsInitial:0,goal:null}}
function loadData(id){let d;try{d=Object.assign(blank(),JSON.parse(store.get("cc_data_"+id)||"null")||{})}catch(e){d=blank()}if(!CUR[d.currency])d.currency="EUR";for(const a of d.accounts)if(!CUR[a.currency])a.currency=d.currency;return d}
function save(){if(P)store.set("cc_data_"+P.id,JSON.stringify(D))}

/* ---------- calculations ---------- */
const accName=id=>{const a=D.accounts.find(a=>a.id===id);return a?a.name:"—"};
function accBalance(a){let b=+a.initial||0;for(const t of D.tx){if(t.accountId!==a.id)continue;b+=TYPES[t.type].sign*t.amount}return b}
const accById=id=>D.accounts.find(a=>a.id===id);
const accCur=a=>(a&&CUR[a.currency])?a.currency:curCode();
const txCur=t=>accCur(accById(t.accountId));
function usedCurs(){const l=[curCode()];for(const a of D.accounts){const c=accCur(a);if(!l.includes(c))l.push(c)}return l}
const isMulti=()=>usedCurs().length>1;
function savingsBal(c){c=c||curCode();let s=c===curCode()?(+D.savingsInitial||0):0;for(const t of D.tx){if(txCur(t)!==c)continue;if(t.type==="ahorro")s+=t.amount;else if(t.type==="retiro")s-=t.amount}return s}
const available=c=>{c=c||curCode();return D.accounts.filter(a=>accCur(a)===c).reduce((s,a)=>s+accBalance(a),0)};
function monthSum(m,c){c=c||curCode();const r={ingreso:0,fijo:0,boludo:0,sub:0,ahorro:0,retiro:0};for(const t of D.tx)if(t.date.slice(0,7)===m&&txCur(t)===c)r[t.type]+=t.amount;return r}
/* sum a list of [amount,currency] into "1.000 € + 20 US$" */
function fmtMix(items,signed){const by={};for(const [n,c] of items)by[c]=(by[c]||0)+n;const ks=usedCurs().filter(c=>c in by&&Math.abs(by[c])>0.004);if(!ks.length)return fmt(0);return ks.map(c=>(signed?(by[c]>=0?"+":"−"):"")+fmt(signed?Math.abs(by[c]):by[c],c)).join(" · ")}
const sumCur=()=>usedCurs().includes(S.sumCur)?S.sumCur:curCode();
const paidIn=(r,m)=>D.tx.find(t=>t.recurringId===r.id&&t.date.slice(0,7)===m);
const sortTx=a=>a.slice().sort((x,y)=>y.date.localeCompare(x.date)||(y.ts||0)-(x.ts||0));

/* ---------- toast / sheet ---------- */
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2000)}
function openSheet(html){$("#sheet").innerHTML=html;$("#ov").classList.add("show")}
function closeSheet(){$("#ov").classList.remove("show");$("#sheet").innerHTML=""}
$("#ov").addEventListener("click",e=>{if(e.target.id==="ov")closeSheet()});
function confirmBox(msg,okLabel,cb){
  openSheet(`<h2>${esc(msg)}</h2><button class="btn" data-act="cf-ok" style="background:var(--red)">${esc(okLabel)}</button><button class="btn sec" data-act="close">Cancelar</button>`);
  confirmCb=cb;
}
let confirmCb=null;

/* ================= LOCK SCREEN ================= */
function renderLock(){
  const st=S.lockStep||(profiles.length?"pick":"name");S.lockStep=st;
  let h=`<div class="lock"><div class="logo">💸</div><h1>Cuentas Claras</h1>`;
  if(st==="pick"){
    h+=`<p>¿Quién eres?</p><div class="profs">${profiles.map(p=>`<button class="prof" data-act="pick" data-id="${p.id}"><span class="av">${esc(p.name.charAt(0).toUpperCase())}</span>${esc(p.name)}</button>`).join("")}</div><button class="link" data-act="newprof">+ Crear otro perfil</button>`;
  }else if(st==="name"){
    h+=`<p>Crea tu perfil. Tus datos se guardan solo en este móvil.</p><div class="profs"><div class="field"><input id="pname" placeholder="Tu nombre" maxlength="24" value="${esc(S.newName)}" autocomplete="off"></div><div class="field" style="text-align:left"><label>¿En qué moneda llevas tus cuentas?</label>${curPicker(S.newCur,"newcur")}</div><button class="btn" data-act="name-ok">Seguir</button>${profiles.length?`<button class="link" data-act="back-pick">Volver</button>`:""}</div>`;
  }else{
    const title=st==="enter"?`Hola, ${esc(P.name)} 👋<br><span style="font-size:15px;color:var(--mut);font-weight:400">Pon tu PIN</span>`:st==="new1"?"Elige un PIN de 4 números":"Repite el PIN";
    h+=`<p style="color:var(--txt);font-size:18px;font-weight:600">${title}</p><div class="dots" id="dots">${[0,1,2,3].map(i=>`<i class="${i<S.pin.length?"f":""}"></i>`).join("")}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="key" data-k="${n}">${n}</button>`).join("")}<button data-act="key" data-k="back" style="font-size:20px">⌫</button><button data-act="key" data-k="0">0</button><span></span></div>
    <button class="link" data-act="back-pick">${st==="enter"?"Cambiar de perfil":"Cancelar"}</button>`;
  }
  $("#app").innerHTML=h+"</div>";
  const pn=$("#pname");if(pn){pn.focus();pn.addEventListener("keydown",e=>{if(e.key==="Enter")act("name-ok")})}
}
async function onKey(k){
  if(k==="back"){S.pin=S.pin.slice(0,-1);return renderLock()}
  if(S.pin.length>=4)return;
  S.pin+=k;renderLock();
  if(S.pin.length<4)return;
  const pin=S.pin;
  await new Promise(r=>setTimeout(r,120));
  if(S.lockStep==="enter"){
    const h=await hashPin(pin,P.salt);
    if(h===P.hash){unlock(P)}else{S.pin="";renderLock();const d=$("#dots");d&&d.classList.add("err");toast("PIN incorrecto")}
  }else if(S.lockStep==="new1"){S.pin1=pin;S.pin="";S.lockStep="new2";renderLock()}
  else if(S.lockStep==="new2"){
    if(pin!==S.pin1){S.pin="";S.lockStep="new1";renderLock();toast("No coinciden, prueba otra vez");return}
    if(P&&P.id&&profiles.find(p=>p.id===P.id)){ // change PIN
      P.salt=uid();P.hash=await hashPin(pin,P.salt);saveProfiles();S.pin="";toast("PIN cambiado ✓");unlock(P);return;
    }
    const salt=uid();const prof={id:uid(),name:S.newName,salt,hash:await hashPin(pin,salt)};store.set("cc_data_"+prof.id,JSON.stringify(Object.assign(blank(),{currency:S.newCur})));
    profiles.push(prof);saveProfiles();S.pin="";unlock(prof);
  }
}
function unlock(p){P=p;D=loadData(p.id);S.pin="";S.pin1="";S.lockStep=null;sess.set("cc_open",p.id);S.view="inicio";S.month=curMonth();render();
  if(!D.accounts.length)setTimeout(()=>accountSheet(null,true),250);
}
function lock(){P=null;D=null;sess.del("cc_open");S.lockStep=null;S.pin="";renderLock()}

/* ================= MAIN ================= */
function render(){
  if(!P)return renderLock();
  const views={inicio:vInicio,movs:vMovs,fijos:vFijos,ahorros:vAhorros,ajustes:vAjustes};
  const nav=[["inicio","🏠","Inicio"],["movs","📋","Movimientos"],["fijos","🔁","Fijos y subs"],["ahorros","🐷","Ahorros"],["ajustes","⚙️","Ajustes"]];
  $("#app").innerHTML=`<div class="wrap">${views[S.view]()}</div>
  <button class="fab" data-act="add" aria-label="Añadir">+</button>
  <nav><div class="in">${nav.map(n=>`<button class="${S.view===n[0]?"on":""}" data-act="nav" data-v="${n[0]}"><i>${n[1]}</i>${n[2]}</button>`).join("")}</div></nav>`;
  window.scrollTo(0,0);
}
const topBar=(t,sub)=>`<div class="top"><div><h1>${t}</h1>${sub?`<div class="sub">${sub}</div>`:""}</div><button class="iconbtn" data-act="lock" title="Bloquear">🔒</button></div>`;
const monthNav=()=>`<div class="monthnav"><button data-act="mprev">‹</button><b>${esc(monthName(S.month))}</b><button data-act="mnext">›</button></div>`;
function txItem(t){
  const T=TYPES[t.type];const plus=T.sign>0;
  return `<button class="item" data-act="edit-tx" data-id="${t.id}" style="--c:${T.c}"><span class="ic">${T.e}</span><span class="mid"><b>${esc(t.concept||T.label)}</b><span>${T.label} · ${esc(accName(t.accountId))}</span></span><span class="amt ${plus?"pos":"neg"}">${plus?"+":"−"}${fmt(t.amount,txCur(t))}</span></button>`;
}

function vInicio(){
  const SC=sumCur(),av=available(),sv=savingsBal(),m=monthSum(S.month,SC),multi=isMulti();
  const gastos=m.fijo+m.boludo+m.sub,netAh=m.ahorro-m.retiro,libre=m.ingreso-gastos-netAh;
  const base=Math.max(m.ingreso,gastos+Math.max(netAh,0),1);
  const seg=["fijo","boludo","sub"].map(k=>`<i style="width:${m[k]/base*100}%;background:${TYPES[k].c}"></i>`).join("")+(netAh>0?`<i style="width:${netAh/base*100}%;background:${TYPES.ahorro.c}"></i>`:"");
  const isCur=S.month===curMonth();
  const pend=isCur?D.recurring.filter(r=>!paidIn(r,S.month)).sort((a,b)=>(a.day||0)-(b.day||0)):[];
  const last=sortTx(D.tx.filter(t=>t.date.slice(0,7)===S.month)).slice(0,6);
  return topBar(`Hola, ${esc(P.name)}`,"Tus cuentas, claras")+
  (multi?`<div class="card hero"><div class="lbl">Saldo total</div>${usedCurs().map((c,i)=>{const a=available(c),v=savingsBal(c);return `<div class="hcur ${i?"":"first"}"><div class="hc-top"><span style="white-space:nowrap">${CUR[c].flag} ${c}</span><b>${fmt(a+v,c)}</b></div><div class="hc-sub">En cuentas ${fmt(a,c)} · En ahorros ${fmt(v,c)}</div></div>`}).join("")}</div>`
  :`<div class="card hero"><div class="lbl">Saldo total</div><div class="big">${fmt(av+sv)}</div><div class="row"><div class="mini"><span>En cuentas</span><b>${fmt(av)}</b></div><div class="mini"><span>En ahorros</span><b>${fmt(sv)}</b></div></div></div>`)+
  (D.accounts.length?`<div class="sect">Mis cuentas <button data-act="new-acc">+ Cuenta</button></div><div class="accs">${D.accounts.map(a=>`<button class="acc" data-act="edit-acc" data-id="${a.id}" style="text-align:left"><span>${multi?CUR[accCur(a)].flag+" ":""}${esc(a.name)}</span><b>${fmt(accBalance(a),accCur(a))}</b></button>`).join("")}</div>`:`<div class="card"><p class="note" style="margin:0 0 12px">Primero añade tu cuenta (banco, efectivo…) con el dinero que tienes hoy.</p><button class="btn" data-act="new-acc">Añadir cuenta</button></div>`)+
  `<div class="sect">Resumen del mes</div>`+monthNav()+
  (multi?`<div class="chips">${usedCurs().map(c=>`<button class="chip ${SC===c?"on":""}" data-act="sumcur" data-c="${c}">${CUR[c].flag} ${CUR[c].sym}</button>`).join("")}</div>`:"")+
  `<div class="grid">
    ${["ingreso","fijo","boludo","sub"].map(k=>`<div class="stat" style="--c:${TYPES[k].c}"><span>${TYPES[k].plural}</span><b>${fmt(m[k],SC)}</b></div>`).join("")}
    <div class="stat" style="--c:${TYPES.ahorro.c}"><span>Ahorrado</span><b>${fmt(netAh,SC)}</b></div>
    <div class="stat" style="--c:${libre>=0?"var(--green)":"var(--red)"}"><span>${libre>=0?"Te sobra":"Te pasaste"}</span><b>${fmt(Math.abs(libre),SC)}</b></div>
  </div>
  <div class="card" style="margin-top:10px"><div style="display:flex;justify-content:space-between;font-size:14px"><span class="note">Gastado de lo que entró</span><b>${m.ingreso>0?Math.round((gastos+Math.max(netAh,0))/m.ingreso*100)+"%":"—"}</b></div><div class="bar">${seg}</div>
  <div class="legend">${["fijo","boludo","sub"].map(k=>`<em style="--c:${TYPES[k].c}">${TYPES[k].plural}</em>`).join("")}<em style="--c:${TYPES.ahorro.c}">Ahorros</em></div></div>`+
  (pend.length?`<div class="sect">Pendientes este mes <button data-act="nav" data-v="fijos">Ver todos</button></div><div class="list">${pend.map(recItem).join("")}</div>`:"")+
  `<div class="sect">Últimos movimientos <button data-act="nav" data-v="movs">Ver todos</button></div>`+
  (last.length?`<div class="list">${last.map(txItem).join("")}</div>`:`<div class="list"><div class="empty">Nada registrado este mes. Toca <b>+</b> para apuntar un gasto.</div></div>`);
}

function vMovs(){
  const all=sortTx(D.tx.filter(t=>t.date.slice(0,7)===S.month));
  const f=S.filter==="todos"?all:all.filter(t=>S.filter==="ahorro"?(t.type==="ahorro"||t.type==="retiro"):t.type===S.filter);
  const chips=[["todos","Todos",""]].concat(["ingreso","fijo","boludo","sub","ahorro"].map(k=>[k,TYPES[k].plural,TYPES[k].c]));
  let groups="",lastD=null;
  for(const t of f){if(t.date!==lastD){groups+=`<div class="dayhead">${esc(dayLabel(t.date))}</div>`;lastD=t.date}groups+=txItem(t)}
  const totTxt=fmtMix(f.map(t=>[TYPES[t.type].sign*t.amount,txCur(t)]),true);
  return topBar("Movimientos",`${f.length} en ${esc(monthName(S.month))}`)+monthNav()+
  `<div class="chips">${chips.map(c=>`<button class="chip ${S.filter===c[0]?"on":""}" style="${c[2]?"--c:"+c[2]:""}" data-act="filter" data-f="${c[0]}">${c[1]}</button>`).join("")}</div>`+
  (f.length?`<div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px"><span class="note">Total</span><b style="text-align:right">${totTxt}</b></div><div class="list">${groups}</div>`:`<div class="list"><div class="empty">No hay movimientos aquí.</div></div>`);
}

function recItem(r){
  const T=TYPES[r.kind];const isCur=S.month===curMonth();const paid=paidIn(r,S.month);
  return `<div class="item" style="--c:${T.c}"><button data-act="edit-rec" data-id="${r.id}" style="display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left"><span class="ic">${T.e}</span><span class="mid"><b>${esc(r.name)}</b><span>${fmt(r.amount,accCur(accById(r.accountId)))}${r.day?` · día ${r.day}`:""} · ${esc(accName(r.accountId))}</span></span></button>${paid?`<span class="pill ok">Pagado ✓</span>`:`<button class="pill go" data-act="pay" data-id="${r.id}">Pagar</button>`}</div>`;
}
function vFijos(){
  const sec=k=>{const list=D.recurring.filter(r=>r.kind===k).sort((a,b)=>(a.day||99)-(b.day||99));const totTxt=fmtMix(list.map(r=>[r.amount,accCur(accById(r.accountId))]));
    return `<div class="sect">${TYPES[k].plural} · ${totTxt}/mes <button data-act="new-rec" data-k="${k}">+ Añadir</button></div>`+
    (list.length?`<div class="list">${list.map(recItem).join("")}</div>`:`<div class="list"><div class="empty">${k==="fijo"?"Alquiler, luz, gimnasio, móvil…":"Netflix, Spotify, iCloud…"}</div></div>`)};
  return topBar("Fijos y suscripciones","Lo que pagas todos los meses")+monthNav()+
  `<p class="note" style="margin:0 4px 4px">Toca <b>Pagar</b> cuando te lo cobren y se descuenta de la cuenta. Cada mes vuelve a salir pendiente.</p>`+sec("fijo")+sec("sub");
}

function vAhorros(){
  const sv=savingsBal();const g=D.goal;
  const hist=sortTx(D.tx.filter(t=>t.type==="ahorro"||t.type==="retiro")).slice(0,30);
  const pct=g&&g.amount>0?Math.min(100,Math.max(0,sv/g.amount*100)):0;
  return topBar("Ahorros","Tu hucha")+
  `<div class="card" style="text-align:center"><div class="note">Tienes ahorrado</div><div style="font-size:38px;font-weight:800;color:#ffd166;margin:4px 0">${fmt(sv)}</div>${isMulti()?usedCurs().slice(1).map(c=>`<div style="font-size:20px;font-weight:700;color:#ffd166">${CUR[c].flag} ${fmt(savingsBal(c),c)}</div>`).join(""):""}
  ${g?`<div class="goal"><i style="width:${pct}%"></i></div><div class="note">${Math.round(pct)}% de <b>${esc(g.name||"tu meta")}</b> (${fmt(g.amount)})${sv<g.amount?` · te faltan ${fmt(g.amount-sv)}`:" · ¡Conseguido! 🎉"}</div>`:""}
  <div class="row2" style="margin-top:14px"><button class="btn" data-act="sv-add" style="background:#ffd166;color:#1a2247">+ Guardar</button><button class="btn sec" data-act="sv-out" style="margin-top:0">Sacar</button></div>
  <button class="link" data-act="goal" style="margin-top:14px">${g?"Editar meta":"Ponerte una meta de ahorro"}</button></div>
  <div class="sect">Historial</div>`+
  (hist.length?`<div class="list">${hist.map(txItem).join("")}</div>`:`<div class="list"><div class="empty">Cuando guardes dinero, sale de tu cuenta y entra aquí. El saldo total no cambia: solo lo apartas.</div></div>`);
}

function vAjustes(){
  return topBar("Ajustes",esc(P.name))+
  `<div class="sect">Cuentas <button data-act="new-acc">+ Añadir</button></div>`+
  (D.accounts.length?`<div class="list">${D.accounts.map(a=>`<button class="item" data-act="edit-acc" data-id="${a.id}" style="--c:var(--or)"><span class="ic">${CUR[accCur(a)].flag}</span><span class="mid"><b>${esc(a.name)}</b><span>${esc(CUR[accCur(a)].name)} · inicial ${fmt(a.initial,accCur(a))}</span></span><span class="amt">${fmt(accBalance(a),accCur(a))}</span></button>`).join("")}</div>`:`<div class="list"><div class="empty">Sin cuentas todavía.</div></div>`)+
  `<div class="sect">Ahorros</div><div class="list"><button class="item" data-act="sv-init" style="--c:#ffd166"><span class="ic">🐷</span><span class="mid"><b>Ahorros que ya tenías</b><span>Lo que tenías apartado antes de usar la app</span></span><span class="amt">${fmt(D.savingsInitial)}</span></button></div>
  <div class="sect">Moneda principal</div>${curPicker(curCode(),"setcur")}<p class="note" style="margin:6px 4px 0">Es la moneda por defecto de tus cuentas nuevas y de tus ahorros iniciales. Cada cuenta puede tener su propia moneda (tócala arriba para cambiarla). Cambiar la moneda solo cambia el símbolo: no convierte importes.</p>
  <div class="sect">Copia de seguridad</div><div class="card"><p class="note" style="margin:0 0 12px">Tus datos viven solo en este móvil. Haz una copia de vez en cuando (por si cambias de móvil o borras el navegador).</p><div class="row2"><button class="btn sec" data-act="export">Exportar</button><button class="btn sec" data-act="import" style="margin-top:0">Importar</button></div></div>
  <div class="sect">Perfil</div>
  <button class="btn sec" data-act="chpin">Cambiar PIN</button>
  <button class="btn sec" data-act="lock">Cerrar sesión</button>
  <button class="btn danger" data-act="delprof" style="margin-top:22px">Eliminar mi perfil y datos</button>`;
}

/* ================= SHEETS ================= */
const accOptions=sel=>D.accounts.map(a=>`<option value="${a.id}" ${a.id===sel?"selected":""}>${esc(a.name)} · ${fmt(accBalance(a),accCur(a))}</option>`).join("");
let ed=null; // editing context

function txSheet(tx,preType){
  if(!D.accounts.length){accountSheet(null,true);return}
  ed={kind:"tx",id:tx?tx.id:null,type:tx?tx.type:(preType||"boludo")};
  const types=ed.type==="retiro"?["retiro"]:ADD_TYPES;
  openSheet(`<h2>${tx?"Editar movimiento":"Nuevo movimiento"}</h2>
  <div class="chips" id="tchips">${types.map(k=>`<button class="chip ${ed.type===k?"on":""}" style="--c:${TYPES[k].c}" data-act="tchip" data-t="${k}">${TYPES[k].e} ${TYPES[k].label}</button>`).join("")}</div>
  <div class="field"><input id="f-amt" class="amtin" inputmode="decimal" placeholder="${ph(accCur(accById(tx?tx.accountId:(D.lastAcc||D.accounts[0].id))))}" value="${tx?amtStr(tx.amount):""}"></div>
  <div class="field"><label>Concepto</label><input id="f-con" placeholder="${ed.type==="ingreso"?"Ej: Asesoría Juan, nómina…":"Ej: Burger, Uber, ropa…"}" maxlength="40" value="${esc(tx?tx.concept:"")}"></div>
  <div class="row2"><div class="field"><label>${ed.type==="ingreso"||ed.type==="retiro"?"Entra en":"Sale de"}</label><select id="f-acc">${accOptions(tx?tx.accountId:(D.lastAcc||D.accounts[0].id))}</select></div>
  <div class="field"><label>Fecha</label><input id="f-date" type="date" value="${tx?tx.date:(S.month===curMonth()?todayStr():S.month+"-01")}"></div></div>
  <button class="btn" data-act="tx-save">Guardar</button>
  ${tx?`<button class="btn danger" data-act="tx-del">Eliminar</button>`:`<button class="btn sec" data-act="close">Cancelar</button>`}`);
  $("#f-acc").addEventListener("change",e=>{$("#f-amt").placeholder=ph(accCur(accById(e.target.value)))});
  if(!tx)setTimeout(()=>{const i=$("#f-amt");i&&i.focus()},250);
}
function txSave(){
  const amount=parseAmt($("#f-amt").value);if(!(amount>0))return toast("Pon un importe");
  const date=$("#f-date").value||todayStr(),accountId=$("#f-acc").value,concept=$("#f-con").value.trim();
  if(ed.id){const t=D.tx.find(t=>t.id===ed.id);Object.assign(t,{type:ed.type,amount,date,accountId,concept})}
  else D.tx.push({id:uid(),ts:Date.now(),type:ed.type,amount,date,accountId,concept});
  D.lastAcc=accountId;save();closeSheet();render();toast(ed.id?"Actualizado ✓":`${TYPES[ed.type].label} apuntado ✓`);
}

function accountSheet(a,first){
  ed={kind:"acc",id:a?a.id:null};
  const used=a&&D.tx.some(t=>t.accountId===a.id)||a&&D.recurring.some(r=>r.accountId===a.id);
  openSheet(`<h2>${a?"Editar cuenta":first?"Tu primera cuenta":"Nueva cuenta"}</h2>
  ${first?`<p class="note" style="margin-top:-6px">Puede ser tu banco, la tarjeta, efectivo… Luego puedes añadir más.</p>`:""}
  <div class="field"><label>Nombre</label><input id="a-name" placeholder="Ej: BBVA, Revolut, Efectivo" maxlength="24" value="${esc(a?a.name:"")}"></div>
  <div class="field"><label>Moneda de la cuenta</label><select id="a-cur">${Object.keys(CUR).map(c=>`<option value="${c}" ${(a?accCur(a):curCode())===c?"selected":""}>${CUR[c].flag} ${esc(CUR[c].name)}</option>`).join("")}</select></div>
  <div class="field"><label>${a?"Saldo inicial (cuando empezaste a usar la app)":"¿Cuánto tienes hoy en esta cuenta?"}</label><input id="a-init" inputmode="decimal" placeholder="${ph(a?accCur(a):null)}" value="${a?amtStr(a.initial):""}"></div>
  ${a?`<p class="note">Saldo actual: <b>${fmt(accBalance(a),accCur(a))}</b></p>`:""}
  <button class="btn" data-act="acc-save">Guardar</button>
  ${a?(used?`<p class="note" style="text-align:center;margin-top:12px">No se puede eliminar: tiene movimientos.</p>`:`<button class="btn danger" data-act="acc-del">Eliminar cuenta</button>`):`<button class="btn sec" data-act="close">${first?"Más tarde":"Cancelar"}</button>`}`);
  $("#a-cur").addEventListener("change",e=>{$("#a-init").placeholder=ph(e.target.value)});
}
function accSave(){
  const name=$("#a-name").value.trim();if(!name)return toast("Ponle un nombre");
  let init=parseAmt($("#a-init").value);if(isNaN(init))init=0;
  const currency=CUR[$("#a-cur").value]?$("#a-cur").value:curCode();
  if(ed.id){Object.assign(D.accounts.find(a=>a.id===ed.id),{name,initial:init,currency})}else D.accounts.push({id:uid(),name,initial:init,currency});
  save();closeSheet();render();toast("Cuenta guardada ✓");
}

function recSheet(r,kind){
  if(!D.accounts.length){accountSheet(null,true);return}
  ed={kind:"rec",id:r?r.id:null,rk:r?r.kind:kind};
  openSheet(`<h2>${r?"Editar":"Nuevo"} ${ed.rk==="sub"?"suscripción":"gasto fijo"}</h2>
  <div class="field"><label>Nombre</label><input id="r-name" placeholder="${ed.rk==="sub"?"Ej: Netflix":"Ej: Alquiler"}" maxlength="30" value="${esc(r?r.name:"")}"></div>
  <div class="row2"><div class="field"><label>Importe al mes</label><input id="r-amt" inputmode="decimal" placeholder="${ph(accCur(accById(r?r.accountId:(D.lastAcc||D.accounts[0].id))))}" value="${r?amtStr(r.amount):""}"></div>
  <div class="field"><label>Día de cobro</label><input id="r-day" inputmode="numeric" placeholder="1–31" value="${r&&r.day?r.day:""}"></div></div>
  <div class="field"><label>Se cobra de</label><select id="r-acc">${accOptions(r?r.accountId:(D.lastAcc||D.accounts[0].id))}</select></div>
  <button class="btn" data-act="rec-save">Guardar</button>
  ${r?`<button class="btn danger" data-act="rec-del">Eliminar</button><p class="note" style="text-align:center">Los pagos ya registrados se mantienen.</p>`:`<button class="btn sec" data-act="close">Cancelar</button>`}`);
}
function recSave(){
  const name=$("#r-name").value.trim(),amount=parseAmt($("#r-amt").value);let day=parseInt($("#r-day").value,10);
  if(!name)return toast("Ponle un nombre");if(!(amount>0))return toast("Pon el importe");
  if(!(day>=1&&day<=31))day=null;const accountId=$("#r-acc").value;
  if(ed.id)Object.assign(D.recurring.find(r=>r.id===ed.id),{name,amount,day,accountId});
  else D.recurring.push({id:uid(),kind:ed.rk,name,amount,day,accountId});
  save();closeSheet();render();toast("Guardado ✓");
}
function pay(id){
  const r=D.recurring.find(r=>r.id===id);if(!r||paidIn(r,S.month))return;
  let date;if(S.month===curMonth())date=todayStr();else{const d=Math.min(r.day||1,daysInMonth(S.month));date=S.month+"-"+pad2(d)}
  D.tx.push({id:uid(),ts:Date.now(),type:r.kind,amount:r.amount,date,accountId:r.accountId,concept:r.name,recurringId:r.id});
  save();render();toast(`${r.name}: −${fmt(r.amount,accCur(accById(r.accountId)))} ✓`);
}

function moneySheet(title,label,val,onOk){
  ed={kind:"money",cb:onOk};
  openSheet(`<h2>${esc(title)}</h2><div class="field"><label>${esc(label)}</label><input id="m-amt" class="amtin" inputmode="decimal" placeholder="${ph()}" value="${val!=null?amtStr(val):""}"></div><button class="btn" data-act="money-ok">Guardar</button><button class="btn sec" data-act="close">Cancelar</button>`);
}
function goalSheet(){
  const g=D.goal;
  openSheet(`<h2>Meta de ahorro</h2><div class="field"><label>¿Para qué ahorras?</label><input id="g-name" placeholder="Ej: Viaje, colchón, coche" maxlength="30" value="${esc(g?g.name:"")}"></div>
  <div class="field"><label>¿Cuánto quieres juntar?</label><input id="g-amt" inputmode="decimal" placeholder="${ph()}" value="${g?amtStr(g.amount):""}"></div>
  <button class="btn" data-act="goal-save">Guardar</button>${g?`<button class="btn danger" data-act="goal-del">Quitar meta</button>`:`<button class="btn sec" data-act="close">Cancelar</button>`}`);
}
function exportSheet(){
  const data=JSON.stringify({app:"cuentas-claras",v:1,name:P.name,exported:new Date().toISOString(),data:D});
  openSheet(`<h2>Exportar copia</h2><p class="note">Guarda este texto (por ejemplo, envíatelo por WhatsApp o en Notas). Para recuperarlo, usa Importar.</p>
  <textarea id="exp" rows="6" readonly style="font-size:12px">${esc(data)}</textarea>
  <button class="btn" data-act="copy" style="margin-top:12px">Copiar</button><button class="btn sec" data-act="dl">Descargar archivo</button><button class="btn sec" data-act="close">Cerrar</button>`);
}
function importSheet(){
  openSheet(`<h2>Importar copia</h2><p class="note">Pega el texto de tu copia o elige el archivo. <b>Reemplaza</b> los datos actuales de este perfil.</p>
  <textarea id="imp" rows="6" placeholder="Pega aquí tu copia" style="font-size:12px"></textarea>
  <div class="field" style="margin-top:10px"><input type="file" id="impf" accept=".json,application/json,text/plain"></div>
  <button class="btn" data-act="imp-ok">Importar</button><button class="btn sec" data-act="close">Cancelar</button>`);
  $("#impf").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("#imp").value=r.result};r.readAsText(f)});
}

/* ================= ACTIONS ================= */
function act(a,el){
  const id=el&&el.dataset.id;
  switch(a){
    /* lock */
    case "pick":P=profiles.find(p=>p.id===id);S.lockStep="enter";S.pin="";renderLock();break;
    case "newprof":S.lockStep="name";S.newName="";S.newCur="EUR";renderLock();break;
    case "newcur":{const pn=$("#pname");if(pn)S.newName=pn.value;S.newCur=el.dataset.c;renderLock();break}
    case "setcur":if(D.currency!==el.dataset.c){const old=D.currency,single=!isMulti();D.currency=el.dataset.c;if(single)D.accounts.forEach(a=>{if(a.currency===old)a.currency=D.currency});save();render();toast("Moneda principal: "+CUR[D.currency].name)}break;
    case "sumcur":S.sumCur=el.dataset.c;render();break;
    case "back-pick":P=null;S.pin="";S.lockStep=profiles.length?"pick":"name";renderLock();break;
    case "name-ok":{const n=$("#pname").value.trim();if(!n)return toast("Escribe tu nombre");if(profiles.some(p=>p.name.toLowerCase()===n.toLowerCase()))return toast("Ese nombre ya existe en este móvil");S.newName=n;P=null;S.lockStep="new1";S.pin="";renderLock();break}
    case "key":onKey(el.dataset.k);break;
    case "lock":lock();break;
    /* nav */
    case "nav":S.view=el.dataset.v;render();break;
    case "mprev":S.month=shiftMonth(S.month,-1);render();break;
    case "mnext":S.month=shiftMonth(S.month,1);render();break;
    case "filter":S.filter=el.dataset.f;render();break;
    case "close":closeSheet();break;
    case "cf-ok":{const cb=confirmCb;confirmCb=null;closeSheet();cb&&cb();break}
    /* tx */
    case "add":txSheet(null,S.view==="ahorros"?"ahorro":null);break;
    case "tchip":ed.type=el.dataset.t;document.querySelectorAll("#tchips .chip").forEach(c=>c.classList.toggle("on",c.dataset.t===ed.type));
      {const lab=$("#f-acc").parentElement.querySelector("label");lab.textContent=ed.type==="ingreso"?"Entra en":"Sale de";$("#f-con").placeholder=ed.type==="ingreso"?"Ej: Asesoría Juan, nómina…":"Ej: Burger, Uber, ropa…"}break;
    case "edit-tx":txSheet(D.tx.find(t=>t.id===id));break;
    case "tx-save":txSave();break;
    case "tx-del":confirmBox("¿Eliminar este movimiento?","Eliminar",()=>{D.tx=D.tx.filter(t=>t.id!==ed.id);save();render();toast("Eliminado")});break;
    /* accounts */
    case "new-acc":accountSheet(null,!D.accounts.length);break;
    case "edit-acc":accountSheet(D.accounts.find(x=>x.id===id));break;
    case "acc-save":accSave();break;
    case "acc-del":confirmBox("¿Eliminar esta cuenta?","Eliminar",()=>{D.accounts=D.accounts.filter(x=>x.id!==ed.id);save();render()});break;
    /* recurring */
    case "new-rec":recSheet(null,el.dataset.k);break;
    case "edit-rec":recSheet(D.recurring.find(r=>r.id===id));break;
    case "rec-save":recSave();break;
    case "rec-del":confirmBox("¿Eliminar este pago mensual?","Eliminar",()=>{D.recurring=D.recurring.filter(r=>r.id!==ed.id);save();render()});break;
    case "pay":pay(id);break;
    /* savings */
    case "sv-add":txSheet(null,"ahorro");break;
    case "sv-out":if(!D.accounts.length)return accountSheet(null,true);
      ed={kind:"tx",id:null,type:"retiro"};txSheet(null,"retiro");break;
    case "goal":goalSheet();break;
    case "goal-save":{const n=$("#g-name").value.trim(),v=parseAmt($("#g-amt").value);if(!(v>0))return toast("Pon una cantidad");D.goal={name:n,amount:v};save();closeSheet();render();break}
    case "goal-del":D.goal=null;save();closeSheet();render();break;
    case "sv-init":moneySheet("Ahorros que ya tenías","Cantidad",D.savingsInitial,v=>{D.savingsInitial=v});break;
    case "money-ok":{let v=parseAmt($("#m-amt").value);if(isNaN(v))v=0;ed.cb(v);save();closeSheet();render();toast("Guardado ✓");break}
    /* backup */
    case "export":exportSheet();break;
    case "copy":{const t=$("#exp");try{navigator.clipboard.writeText(t.value).then(()=>toast("Copiado ✓"),()=>{t.select();toast("Selecciona y copia el texto")})}catch(e){t.select();toast("Selecciona y copia el texto")}break}
    case "dl":try{const b=new Blob([$("#exp").value],{type:"application/json"});const u=URL.createObjectURL(b);const l=document.createElement("a");l.href=u;l.download="cuentas-claras-"+P.name.toLowerCase().replace(/\W+/g,"-")+"-"+todayStr()+".json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(e){toast("Usa Copiar")}break;
    case "import":importSheet();break;
    case "imp-ok":{try{const o=JSON.parse($("#imp").value);const d=o&&o.data?o.data:o;if(!d||!Array.isArray(d.tx)||!Array.isArray(d.accounts))throw 0;
      confirmBox("¿Reemplazar tus datos por esta copia?","Reemplazar",()=>{store.set("cc_data_"+P.id,JSON.stringify(d));D=loadData(P.id);save();render();toast("Copia importada ✓")})}catch(e){toast("Ese texto no es una copia válida")}break}
    /* profile */
    case "chpin":S.lockStep="new1";S.pin="";S.newName=P.name;renderLock();break;
    case "delprof":confirmBox(`¿Eliminar el perfil de ${P.name} y todos sus datos de este móvil?`,"Eliminar todo",()=>{store.del("cc_data_"+P.id);profiles=profiles.filter(p=>p.id!==P.id);saveProfiles();lock();toast("Perfil eliminado")});break;
  }
}
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;e.preventDefault();act(el.dataset.act,el)});
document.addEventListener("keydown",e=>{
  if(document.querySelector(".pad")){if(/^[0-9]$/.test(e.key))onKey(e.key);else if(e.key==="Backspace")onKey("back")}
  else if(e.key==="Enter"&&$("#ov").classList.contains("show")&&e.target.tagName==="INPUT"){const b=$("#sheet .btn");b&&b.click()}
  else if(e.key==="Escape")closeSheet();
});

/* ---------- start ---------- */
const open=sess.get("cc_open");const op=open&&profiles.find(p=>p.id===open);
if(op)unlock(op);else renderLock();
})();
</script>
</body>
</html>
